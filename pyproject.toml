[tool.poetry]
authors = ["Bastien Gautier <contact@bastiengautier.com>"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
]
description = "A universal media player can combine multiple existing entities in Home Assistant into a single media player entity."
documentation = "https://github.com/bastgau/ha-custom-universal-media-player"
homepage = "https://github.com/bastgau/ha-custom-universal-media-player"
license = "MIT"
maintainers = ["Bastien Gautier <contact@bastiengautier.com>"]
name = "Custom Universal Media Player for Home Assistant"
packages = []
readme = "README.md"
repository = "https://github.com/bastgau/ha-custom-universal-media-player"
version = "0.0.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/bastgau/ha-custom-universal-media-player/issues"
Changelog = "https://github.com/bastgau/ha-custom-universal-media-player/releases"


[tool.poetry.dependencies]
homeassistant = "2026.7.0"
python = ">=3.14,<3.15"

[tool.poetry.group.dev.dependencies]
prek = "0.4.8"
pylint = "4.0.6"
ruff = "0.15.20"

# Test dependencies, mirroring home-assistant/core requirements_test.txt for
# the version pinned above, since the test helpers under tests/ come from it.
freezegun = "1.5.5"
paho-mqtt = "2.1.0"
pytest = "9.0.3"
pytest-aiohttp = "1.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
pytest-freezer = "0.4.9"
pytest-socket = "0.8.0"
pytest-timeout = "2.4.0"
pytest-unordered = "0.8.0"
pytest-xdist = "3.8.0"
requests-mock = "1.12.1"
respx = "0.23.1"
syrupy = "5.3.2"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.ruff.lint]
ignore = [
  "ANN401",  # Opiniated warning on disallowing dynamically typed expressions
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "TID252",  # Relative imports
  "RUF012",  # Just broken
  "D202",    # No blank lines allowed after function docstring
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "D404",    # First word of the docstring should not be This
  "D406",    # Section name should end with a newline
  "D407",    # Section name underlining
  "D411",    # Missing blank line before section
  "E501",    # line too long
  "E731",    # do not assign a lambda expression, use a def
  "PLR2004", # Magic value used in comparison, consider replacing `xxx` with a constant variable
  "FBT001",  # Boolean default positional argument in function definition
  "FBT002",  # Boolean-typed positional argument in function definition
  "ARG002",  # Unused method argument: `kwargs`
  "PLR0911", # Too many return statements (19 > 6)
  "PLR0912", # Too many branches"
  "PLR0915", # Too many statements (58 > 50)"
  "BLE001",  # Do not catch blind exception: `Exception`
  "S110",    # `try`-`except`-`pass` detected, consider logging the exception"

  # Formatter conflicts
  "COM812",
  "COM819",
  "D206",
  "E501",
  "ISC001",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]
select = ["ALL"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
voluptuous = "vol"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff
# duplicate-code - unavoidable
# used-before-assignment - false positives with TYPE_CHECKING structures
disable = [
  "abstract-method",
  "duplicate-code",
  "format",
  "unexpected-keyword-arg",
  "used-before-assignment",
]

[tool.mypy]
# Specify the target platform details in config, so your developers are
# free to run mypy on Windows, Linux, or macOS and get consistent
# results.
platform = "linux"
python_version = "3.14"

# show error messages from unrelated files
follow_imports = "normal"

# suppress errors about unsatisfied imports
ignore_missing_imports = true

# be strict
# check_untyped_defs = true
# disallow_any_generics = true
# disallow_incomplete_defs = true
# disallow_subclassing_any = true
# disallow_untyped_calls = true
# disallow_untyped_decorators = true
# disallow_untyped_defs = true
# no_implicit_optional = true
# strict_optional = true
# warn_incomplete_stub = true
# warn_no_return = true
# warn_redundant_casts = true
# warn_return_any = true
# warn_unused_configs = true
# warn_unused_ignores = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff]
line-length = 120
indent-width = 4
src = ["custom_components/ha-custom-universal-media-player"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_format = "%(asctime)s.%(msecs)03d %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["custom_components/custom_universal_media_player"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
