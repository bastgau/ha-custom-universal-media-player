---
name: "Lint"

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  PYTHON_VERSION: "3.14"

jobs:
  changes:
    name: "changes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    outputs:
      python: "${{ steps.filter.outputs.python }}"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "dorny/paths-filter@v4"
        id: "filter"
        with:
          filters: |
            python:
              - "custom_components/custom_universal_media_player/**/*.py"
              - "pyproject.toml"
              - ".github/workflows/lint.yml"

  lint:
    name: "${{ matrix.name }}"
    needs: "changes"
    if: "needs.changes.outputs.python == 'true'"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "integration"
            paths: "custom_components/custom_universal_media_player/*.py"
            extra_requirements: ""
          - name: "tests"
            paths: "tests/components/"
            extra_requirements: "-r requirements_test.txt"

    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"
          cache-dependency-path: |
            requirements-lint.txt

      - name: "Install the lint toolchain"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ${{ matrix.extra_requirements }}

      - name: "Lint with Ruff"
        if: "success()"
        run: ruff check --output-format=github ${{ matrix.paths }}

      - name: "Format with Ruff"
        if: "success()"
        run: ruff format --check --diff ${{ matrix.paths }}

